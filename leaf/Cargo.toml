[package]
name = "leaf"
version = "0.1.2"
authors = ["eycorsican <eric.y.corsican@gmail.com>"]
edition = "2021"
build = "build.rs"

[lib]
name = "leaf"
path = "src/lib.rs"

[features]
default = [
    "default-aws-lc"
]

default-ring = [
    "all-configs",
    "all-endpoints",
    "ring-aead",
    "rustls-tls",
    "rustls-tls-ring",
    "quinn-ring",
    "dns-tls",
    "dns-quic",
    "api",
]

default-aws-lc = [
    "all-configs",
    "all-endpoints",
    "aws-lc-aead",
    "rustls-tls",
    "rustls-tls-aws-lc",
    "quinn-aws-lc",
    "dns-tls",
    "dns-quic",
    "api",
]

default-openssl = [
    "all-configs",
    "all-endpoints",
    "openssl-aead",
    "openssl-tls",
    "quinn-ring",
    "dns-tls",
    "dns-quic",
]

rustls-tls-aws-lc = ["tokio-rustls/aws_lc_rs", "rustls/aws_lc_rs", "reality-rustls?/aws_lc_rs"]
rustls-tls-ring = ["tokio-rustls/ring", "rustls/ring"]

quinn-ring = ["quinn/rustls-ring", "quinn/runtime-tokio"]
quinn-aws-lc = ["quinn/rustls-aws-lc-rs", "quinn/runtime-tokio"]

# Grouping all features
all-configs = [
    "config-conf",
    "config-json",
    "config-yaml",
]
all-endpoints = [
    # inbounds
    "inbound-chain",
    "inbound-amux",
    "inbound-quic",
    "inbound-ws",
    "inbound-tls",
    "inbound-mptp",
    "inbound-http",
    "inbound-hc",
    "inbound-socks",
    "inbound-tun",
    "inbound-cat",
    "inbound-tproxy",
    "inbound-vless",
    "inbound-reality",
    "inbound-xhttp",
    "inbound-finalmask",
    "inbound-hysteria2",
    # outbounds
    "outbound-direct",
    "outbound-drop",
    "outbound-redirect",
    "outbound-shadowsocks",
    "outbound-obfs",
    "outbound-socks",
    "outbound-trojan",
    "outbound-tls",
    "outbound-ws",
    "outbound-amux",
    "outbound-vmess",
    "outbound-quic",
    "outbound-failover",
    "outbound-static",
    "outbound-tryall",
    "outbound-chain",
    "outbound-vless",
    "outbound-reality",
    "outbound-mptp",
    "outbound-select",
    "outbound-xhttp",
    "outbound-finalmask",
    "outbound-hysteria2",
]

# Ring-related
ring-aead = ["ring"]
aws-lc-aead = ["aws-lc-rs"]
rustls-tls = ["tokio-rustls", "webpki-roots", "rustls-pemfile", "rustls"]

# Openssl-related, for platforms not supported by ring, such as mips
openssl-aead = ["openssl"]
openssl-tls = ["openssl", "tokio-openssl", "openssl-probe"]

# Config formats
config-conf = ["regex"]
config-json = ["serde", "serde_derive", "serde_json"]
config-yaml = ["serde", "serde_derive", "serde_yaml_ng"]

# Router rules
rule-process-name = ["regex"]

# DNS
dns-tls = ["rustls-tls"]
dns-quic = ["quinn-ring", "rustls"]

# Outbounds
outbound-direct = []
outbound-drop = []
outbound-redirect = []
outbound-shadowsocks = ["hkdf", "sha1", "md-5", "percent-encoding", "tokio-util"]
outbound-obfs = ["base64", "memchr"]
outbound-socks = ["async-socks5"]
outbound-trojan = ["sha2", "hex"]
outbound-tls = ["sha2", "hex"]
outbound-ws = ["tungstenite", "tokio-tungstenite", "url", "http"]
outbound-failover = ["lru_time_cache"]
outbound-static= []
outbound-tryall = []
outbound-chain = []
outbound-vless = [
    "hex",
    "base64",
    "ml-kem",
    "x25519-dalek",
    "blake3",
    "chacha20poly1305",
    "aes-gcm",
    "aes",
]
outbound-reality = ["reality", "reality-rustls", "webpki-roots", "rustls-pemfile", "hex", "base64"]
outbound-amux= ["tokio-util"]
outbound-quic = ["rustls"]
outbound-mptp = []
outbound-select = ["directories", "axum/query"]
outbound-vmess = ["lz_fnv", "cfb-mode", "hmac", "sha2", "aes", "aes-gcm", "sha3", "digest", "md-5", "tokio-util", "byteorder", "crc32fast"]
outbound-xhttp = ["http", "url", "serde_json"]
outbound-finalmask = ["serde_json"]
outbound-hysteria2 = ["quinn", "rustls", "h3", "h3-quinn", "blake2", "http", "webpki-roots", "rustls-pemfile"]

# Inbounds
inbound-mptp = []
inbound-socks = []
inbound-http = ["http"]
inbound-hc = []
inbound-tun = ["tun", "netstack-lwip", "netstack-smoltcp", "pnet_datalink"]
inbound-ws = ["tungstenite", "tokio-tungstenite", "url", "http"]
inbound-amux = ["tokio-util"]
inbound-quic = ["rustls"]
inbound-tls = []
inbound-chain = []
inbound-cat = ["tokio/io-std"]
inbound-tproxy = []
inbound-vless = [
    "base64",
    "ml-kem",
    "x25519-dalek",
    "blake3",
    "chacha20poly1305",
    "aes-gcm",
    "aes",
]
inbound-reality = ["reality", "reality-rustls", "rustls-pemfile", "hex", "base64", "x25519-dalek", "hkdf", "sha2", "aes-gcm", "hmac"]
inbound-xhttp = ["http", "url", "serde_json"]
inbound-finalmask = ["serde_json"]
inbound-hysteria2 = ["quinn", "rustls", "h3", "h3-quinn", "blake2", "http", "rustls-pemfile"]

plugin = ["async-ffi", "libloading"]
api = ["axum"]
auto-reload = ["notify"]
ctrlc = ["tokio/signal"]

[dependencies]
# Common
tokio = { version = "1.53.1", features = ["sync", "io-util", "net", "time", "rt", "rt-multi-thread", "macros"] }
protobuf = "3.6"
thiserror = "1.0"
futures = "0.3.34"
async-trait = "0.1.92"
bytes = "1.12.1"
lazy_static = "1.5"
anyhow = "1.0.104"
rand = "0.8"
socket2 = "0.5"
async-recursion = "1.1.1"
parking_lot = "0.12.5"
uuid = { version = "1.26.1", features = ["v4"] }

# DNS
hickory-proto = { version = "0.24", default-features = false }
lru = "0.12"

# Logging
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
chrono = "0.4.45"

# Router
maxminddb = { version = "0.24", features = ["mmap"] }
cidr = "0.2"
regex = { version = "1.13.1", optional = true }

# outbound-select
directories = { version = "4.0", optional = true }

# plugin
async-ffi = { version = "0.2", optional = true }
libloading = { version = "0.7", optional = true }

# config-json
serde_json = { version = "1.0.151", features = ["raw_value"], optional = true }
serde_derive = { version = "1.0.229", optional = true }
serde = { version = "1.0.229", optional = true }

# config-yaml
serde_yaml_ng = { version = "0.10", optional = true }

# config-conf

openssl = { version = "0.10.81", features = ["vendored"], optional = true }

ring = { version = "0.17.14", optional = true }

aws-lc-rs = { version = "1.18.1", optional = true }

# TLS/rustls/QUIC
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }

# TLS/openssl
openssl-probe = { version = "0.1", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }

# WebSocket
tungstenite = { version = "0.24", default-features = false, optional = true }
tokio-tungstenite = { version = "0.24", optional = true }

# WebSocket
url = { version = "2.5.8", optional = true }
http = { version = "1.5.0", optional = true }

# SOCKS outbound
async-socks5 = { version = "0.6", optional = true }

# Shadowsocks
hkdf = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10.7", optional = true }
percent-encoding = { version = "2.3.2", optional = true }

# Obfs
base64 = { version = "0.22", optional = true }
memchr = { version = "2.8.3", optional = true }

# Trojan
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4.3", optional = true }

# VMess
lz_fnv = { version = "0.1.2", optional = true }
cfb-mode = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
byteorder = { version = "1.5.0", optional = true }
crc32fast = { version = "1.5.2", optional = true }

# VLESS encryption (mlkem768x25519plus)
blake3 = { version = "1.8.7", optional = true }
ml-kem = { version = "0.3.2", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

# Failover
lru_time_cache = { version = "0.11.11", optional = true }

# amux
tokio-util = { version = "0.7.19", default-features = false, features = ["io", "codec", "compat"], optional = true }

# QUIC
quinn = { version = "0.11.12", default-features = false, optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["std"], optional = true }

# Hysteria2 (HTTP/3 client for the auth exchange; blake2 for the password hash)
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
blake2 = { version = "0.10", optional = true }

# Reality
reality = { git = "https://github.com/Acheirial/reality-rs.git", rev = "8824b070d4a7b2b33d7553c430d1d3745f858ec2", optional = true }
reality-rustls = { package = "rustls", git = "https://github.com/Acheirial/reality-rustls.git", rev = "a23b7ed094ae3998e163878821fe864a6efc0469", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
# X25519 scalar multiplication for the REALITY inbound server auth (the patched
# rustls exposes no static-key ECDH for the server side).
x25519-dalek = { version = "2", optional = true }

# API
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json"], optional = true }

# Auto reload
notify = { version = "6", optional = true }

# TUN
tun = { version = "0.7", features = ["async"], optional = true  }
netstack-lwip = { git = "https://github.com/Acheirial/netstack-lwip", rev = "bad84d50d262b2c592e9839b6048422d242956f0", optional = true }
netstack-smoltcp = { git = "https://github.com/Acheirial/netstack-smoltcp", rev = "1068d9d7bf733484f2672e75b4064c0def472bc8", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = "0.3.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
pnet_datalink = { version = "0.34", package = "pnet_datalink", optional = true }
libc = "0.2.189"

# Used in mobile logger
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "android"))'.dependencies]
memchr = { version = "2.8.3" }

[dev-dependencies]
rcgen = "0.13"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["fs", "sync", "io-util", "net", "time", "rt", "rt-multi-thread"] }

[build-dependencies]
bindgen = "0.72"
protobuf-codegen = "=3.6.0"
protoc-bin-vendored = "3.2"
