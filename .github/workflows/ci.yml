name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: test leaf
        run: |
          # Bisect aid on a throwaway branch: the suite stops at
          # test_finalmask_tcp, so run only that binary under a bound and say
          # how it ended (137 is the hang; macOS has no GNU timeout).
          cargo test -p leaf --no-fail-fast --test test_finalmask_tcp &
          pid=$!
          ( sleep 300; kill -9 $pid 2>/dev/null ) &
          watchdog=$!
          wait $pid
          code=$?
          kill $watchdog 2>/dev/null
          echo "finalmask-binary-exit=$code"

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: build leaf
        run: cargo build -p leaf --release

  build-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - x86_64-pc-windows-gnu
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: install deps
        run: |
          sudo apt update && sudo apt install llvm-dev libclang-dev clang libssl-dev pkg-config protobuf-compiler make -y

      - name: install cross
        run: |
          cargo install cross

      - name: build
        run: |
          cross build --release -p leaf --target ${{ matrix.target }}

  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        features:
          - default-ring
          - default-openssl
          - config-json
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: build leaf with ${{ matrix.features }}
        run: cargo build -p leaf --no-default-features --features ${{ matrix.features }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: build book
        run: mdbook build docs

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: build docs
        run: cargo doc -p leaf --no-deps

  proto-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: regenerate protobuf bindings
        run: |
          touch leaf/build.rs
          PROTO_GEN=1 cargo build -p leaf || true

      - name: upload regenerated bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-internal-config-rs
          path: leaf/src/config/internal/config.rs

      - name: fail when the checked-in bindings are stale
        run: git diff --exit-code -- leaf/src/config/internal/config.rs

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: install rust toolchain
        uses: hecrj/setup-rust-action@v1
        with:
          rust-version: stable

      - name: install rustfmt
        run: rustup component add rustfmt

      - name: check formatting
        run: cargo fmt --all -- --check
